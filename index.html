    <h1>YOUTUBE FFMPEG</h1>
    <p class="intro">个人频道直播工作台</p>
    <p>频道管理员可以把预先录好的影片编成播放列表，为每路直播设定主题、重复次数、时长和场间间隔。</p>
    <h2>如何使用 YouTube 授权</h2>
    <p>工作台使用 YouTube API 服务。管理员在 Google 同意授权后，可以安排直播、检查 YouTube 的收流状态，以及在设定的时间结束本场、开始下一场。</p>
    <p>此工作台供频道管理员个人使用。管理员通过专用连接访问工作台。观看直播请前往 YouTube 上相应的观看页。</p>
