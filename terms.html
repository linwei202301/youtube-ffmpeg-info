    <h1>使用条款</h1>
    <p>YOUTUBE FFMPEG 是供频道管理员使用的直播工具。管理员负责选择影片、设置播放顺序、安排时间和决定每场直播的观看权限。</p>
    <h2>内容与授权</h2>
    <p>仅推送自己有权播放的影音，遵守版权要求和 YouTube 的社区规范。使用工作台的 YouTube API 功能即表示同意受 <a href="https://www.youtube.com/t/terms">YouTube 服务条款</a>约束。</p>
    <h2>直播与排程</h2>
    <p>直播可用性取决于服务器、网络和 YouTube 的收流状况。管理员可随时在工作台停播，并在 YouTube Studio 核对场次状态和可见性。</p>
